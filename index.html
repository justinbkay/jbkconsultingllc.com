  <style>
    *,
    *::before,

      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #fafaf7;
      --bg-alt: #f2f0eb;
      --bg-dark: #1c1c1a;
      --ink: #1c1c1a;
      --ink-mid: #4a4a45;
      --ink-soft: #7a7a72;
      --accent: #2f7d56;
      --accent-light: #e4f3eb;
      --border: #e2e0d8;
      --serif: 'Lora', Georgia, serif;

      --shadow: 0 2px 12px rgba(0, 0, 0, 0.07);

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;

    #root {

    /* Scroll reveal */
    .reveal {
      opacity: 1;

      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: none;
    }

    .reveal-delay-1 {
      transition-delay: 0.1s;
    }

    .reveal-delay-2 {
      transition-delay: 0.2s;
    }

    .reveal-delay-3 {
      transition-delay: 0.3s;
    }

    .reveal-delay-4 {
      transition-delay: 0.4s;
    }

    ::selection {
      background: var(--accent-light);
    }

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "#2f7d56",
      "heroHeadline": "Custom software for\nbusinesses that need it to work.",
      "showTestimonials": false
    }/*EDITMODE-END*/;

    /* ── Scroll Reveal Hook ── */
    function useReveal() {
      useEffect(() => {
        const els = document.querySelectorAll('.reveal');
        const obs = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
        }, { threshold: 0.12 });
        els.forEach(el => obs.observe(el));
        return () => obs.disconnect();
      }, []);
    }

    /* ── Nav ── */
    function Nav({ activeSection }) {
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      const links = ['Services', 'Expertise', 'Projects', 'About', 'FAQ', 'Contact'];

      const navStyle = {
        position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
        background: scrolled ? 'rgba(250,250,247,0.95)' : 'transparent',
        backdropFilter: scrolled ? 'blur(8px)' : 'none',
        borderBottom: scrolled ? '1px solid var(--border)' : '1px solid transparent',
        transition: 'all 0.3s ease',
        padding: '0 32px',
      };

      const innerStyle = {
        maxWidth: 1100, margin: '0 auto',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        height: 64,
      };

      return (
        <nav style={navStyle}>
          <div style={innerStyle}>
            <a href="#top" style={{ fontFamily: 'var(--serif)', fontWeight: 600, fontSize: '1.1rem', color: 'var(--ink)', textDecoration: 'none', letterSpacing: '-0.2px' }}>
              JBK Consulting
            </a>
            <div style={{ display: 'flex', gap: 32, alignItems: 'center' }}>
              {links.map(l => (
                <a key={l} href={`#${l.toLowerCase()}`} style={{
                  fontFamily: 'var(--sans)', fontSize: '0.875rem', fontWeight: 500,
                  color: activeSection === l.toLowerCase() ? 'var(--accent)' : 'var(--ink-mid)',
                  textDecoration: 'none', transition: 'color 0.2s',
                }}
                  onMouseEnter={e => e.target.style.color = 'var(--accent)'}
                  onMouseLeave={e => e.target.style.color = activeSection === l.toLowerCase() ? 'var(--accent)' : 'var(--ink-mid)'}
                >{l}</a>
              ))}
              <a href="#contact" style={{
                background: 'var(--accent)', color: '#fff', fontWeight: 500,
                padding: '8px 20px', borderRadius: 100, fontSize: '0.875rem',
                textDecoration: 'none', transition: 'opacity 0.2s',
              }}
                onMouseEnter={e => e.target.style.opacity = '0.85'}
                onMouseLeave={e => e.target.style.opacity = '1'}
              >Let's talk</a>
            </div>
          </div>
        </nav>
      );
    }

    /* ── Hero ── */
    function Hero({ tweaks }) {
      const headline = tweaks.heroHeadline.split('\n');
      return (
        <section id="top" style={{
          minHeight: '100vh', display: 'flex', alignItems: 'center',
          background: 'var(--bg)', padding: '120px 32px 80px',
        }}>
          <div style={{ maxWidth: 1100, margin: '0 auto', width: '100%' }}>
            <div style={{ maxWidth: 720 }}>
              <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.85rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 24 }}>
                Custom Software Development · Idaho & Remote
              </p>
              <h1 className="reveal reveal-delay-1" style={{
                fontFamily: 'var(--serif)', fontSize: 'clamp(2.8rem, 6vw, 5rem)',
                fontWeight: 600, lineHeight: 1.1, letterSpacing: '-1px',
                marginBottom: 28, color: 'var(--ink)',
              }}>
                {headline.map((l, i) => <span key={i}>{l}{i < headline.length - 1 && <br />}</span>)}
              </h1>
              <p className="reveal reveal-delay-2" style={{ fontSize: '1.15rem', color: 'var(--ink-mid)', maxWidth: 560, marginBottom: 44, lineHeight: 1.7 }}>
                I help small businesses replace fragile spreadsheets, modernize aging applications, and build reliable web software that supports the way they actually operate.
              </p>
              <div className="reveal reveal-delay-3" style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
                <a href="#contact" style={{
                  background: 'var(--accent)', color: '#fff', padding: '14px 32px',
                  borderRadius: 100, fontWeight: 600, fontSize: '0.95rem',
                  textDecoration: 'none', transition: 'opacity 0.2s',
                }}
                  onMouseEnter={e => e.target.style.opacity = '0.85'}
                  onMouseLeave={e => e.target.style.opacity = '1'}
                >Book a project consult</a>
                <a href="#projects" style={{
                  border: '1.5px solid var(--border)', color: 'var(--ink)', padding: '14px 32px',
                  borderRadius: 100, fontWeight: 500, fontSize: '0.95rem',
                  textDecoration: 'none', transition: 'border-color 0.2s, color 0.2s', background: 'transparent',
                }}
                  onMouseEnter={e => { e.target.style.borderColor = 'var(--accent)'; e.target.style.color = 'var(--accent)'; }}
                  onMouseLeave={e => { e.target.style.borderColor = 'var(--border)'; e.target.style.color = 'var(--ink)'; }}
                >See selected work</a>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ── Fit ── */
    const fitItems = [
      'Your business runs on spreadsheets, manual workarounds, or disconnected tools.',
      'You have a legacy Rails, .NET, or custom app that needs stability before new features.',
      'You need an experienced solo consultant who can talk directly with business owners and technical teams.',
      'You want maintainable software, clear communication, and no agency handoffs.'
    ];

    function BestFit() {
      return (
        <section id="fit" style={{ background: 'var(--bg)', padding: '90px 32px 40px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 56, alignItems: 'start' }}>
            <div>
              <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.8rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 16 }}>Best fit</p>
              <h2 className="reveal reveal-delay-1" style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 600, lineHeight: 1.2, marginBottom: 20 }}>
                Practical software help for growing small businesses.
              </h2>
              <p className="reveal reveal-delay-2" style={{ color: 'var(--ink-mid)', lineHeight: 1.8 }}>
                JBK Consulting is a good fit when off-the-shelf software no longer matches your workflow, but you do not need a large agency or full-time engineering team.
              </p>
            </div>
            <div className="reveal reveal-delay-2" style={{ display: 'grid', gap: 14 }}>
              {fitItems.map((item, i) => (
                <div key={i} style={{ background: 'var(--bg-alt)', border: '1px solid var(--border)', borderRadius: 12, padding: '22px 24px', display: 'flex', gap: 14, alignItems: 'flex-start' }}>
                  <span style={{ width: 24, height: 24, borderRadius: '50%', background: 'var(--accent-light)', color: 'var(--accent)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, flexShrink: 0 }}>✓</span>
                  <p style={{ color: 'var(--ink-mid)', fontSize: '0.95rem', lineHeight: 1.65 }}>{item}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── Services ── */
    const services = [
      { title: 'Custom Web Applications', desc: 'Purpose-built internal tools, customer portals, dashboards, and workflow systems designed around how your business actually runs.' },
      { title: 'Legacy System Modernization', desc: 'Stabilize aging Rails, .NET, or custom codebases, reduce risk, and create a realistic path forward without disrupting daily operations.' },
      { title: 'API Design & Integration', desc: 'Connect CRMs, payment systems, data platforms, internal tools, and third-party services with clean, reliable integrations.' },
      { title: 'Technical Advisory', desc: 'Get senior technical judgment for architecture decisions, vendor reviews, roadmap planning, estimates, and rescue projects.' },
    ];

    function Services() {
      return (
        <section id="services" style={{ background: 'var(--bg-dark)', padding: '100px 32px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto' }}>
            <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.8rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 16 }}>What I do</p>
            <h2 className="reveal reveal-delay-1" style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 600, color: '#fafaf7', marginBottom: 60, lineHeight: 1.2 }}>
              Ways I can help
            </h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 2 }}>
              {services.map((s, i) => (
                <div key={i} className={`reveal reveal-delay-${i % 4}`} style={{
                  padding: '40px 36px', background: 'rgba(255,255,255,0.04)',
                  border: '1px solid rgba(255,255,255,0.07)',
                  transition: 'background 0.2s',
                }}
                  onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.07)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.04)'}
                >
                  <div style={{ width: 36, height: 3, background: 'var(--accent)', marginBottom: 24, borderRadius: 2 }} />
                  <h3 style={{ fontFamily: 'var(--serif)', fontSize: '1.2rem', fontWeight: 600, color: '#fafaf7', marginBottom: 12 }}>{s.title}</h3>
                  <p style={{ color: 'rgba(250,250,247,0.55)', fontSize: '0.9rem', lineHeight: 1.75 }}>{s.desc}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── Engagements ── */
    const engagements = [
      { title: 'Software Health Check', desc: 'A focused review of an existing application, architecture, deployment process, and risk areas with prioritized recommendations.' },
      { title: 'Build or Modernization Sprint', desc: 'A scoped implementation engagement for a new feature, internal tool, integration, or modernization milestone.' },
      { title: 'Ongoing Technical Partner', desc: 'Fractional senior engineering support for businesses that need steady product, architecture, and implementation help.' },
    ];

    function Engagements() {
      return (
        <section id="engagements" style={{ background: 'var(--bg-dark)', padding: '90px 32px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto' }}>
            <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.8rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 16 }}>How work starts</p>
            <h2 className="reveal reveal-delay-1" style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 600, color: '#fafaf7', marginBottom: 18, lineHeight: 1.2 }}>
              Start with a clear next step.
            </h2>
            <p className="reveal reveal-delay-2" style={{ color: 'rgba(250,250,247,0.58)', maxWidth: 680, lineHeight: 1.8, marginBottom: 44 }}>
              Whether you need a second opinion, a rescue plan, or a production-ready build, the engagement should be scoped enough to reduce uncertainty before writing a lot of code.
            </p>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 18 }}>
              {engagements.map((e, i) => (
                <div key={i} className={`reveal reveal-delay-${i}`} style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 14, padding: '30px 28px' }}>
                  <div style={{ color: 'var(--accent)', fontWeight: 700, fontSize: '0.78rem', marginBottom: 14 }}>0{i + 1}</div>
                  <h3 style={{ fontFamily: 'var(--serif)', fontSize: '1.25rem', fontWeight: 600, color: '#fafaf7', marginBottom: 12 }}>{e.title}</h3>
                  <p style={{ color: 'rgba(250,250,247,0.56)', fontSize: '0.92rem', lineHeight: 1.75 }}>{e.desc}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── Expertise ── */
    const stack = [
      { name: 'Ruby on Rails', detail: 'Full-stack · APIs · Admin tools', years: '10+ yrs' },
      { name: 'Elixir / Phoenix', detail: 'Real-time · High-concurrency', years: '5+ yrs' },
      { name: 'Node.js', detail: 'APIs · Microservices · CLIs', years: '8+ yrs' },
      { name: '.NET / C#', detail: 'Enterprise · Background workers', years: '6+ yrs' },
      { name: 'PostgreSQL', detail: 'Schema design · Optimization', years: '10+ yrs' },
      { name: 'React', detail: 'Front-end · Dashboards · SPAs', years: '6+ yrs' },
    ];

    function Expertise() {
      return (
        <section id="expertise" style={{ background: 'var(--bg-alt)', padding: '100px 32px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto' }}>
            <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.8rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 16 }}>The toolkit</p>
            <h2 className="reveal reveal-delay-1" style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 600, color: 'var(--ink)', marginBottom: 60, lineHeight: 1.2 }}>
              Technical expertise
            </h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16 }}>
              {stack.map((t, i) => (
                <div key={i} className={`reveal reveal-delay-${i % 4}`} style={{
                  background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 10,
                  padding: '28px 28px', display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                  transition: 'box-shadow 0.2s, border-color 0.2s',
                }}
                  onMouseEnter={e => { e.currentTarget.style.boxShadow = 'var(--shadow)'; e.currentTarget.style.borderColor = 'var(--accent)'; }}
                  onMouseLeave={e => { e.currentTarget.style.boxShadow = 'none'; e.currentTarget.style.borderColor = 'var(--border)'; }}
                >
                  <div>
                    <div style={{ fontFamily: 'var(--serif)', fontWeight: 600, fontSize: '1.05rem', marginBottom: 4 }}>{t.name}</div>
                    <div style={{ color: 'var(--ink-soft)', fontSize: '0.85rem' }}>{t.detail}</div>
                  </div>
                  <span style={{ background: 'var(--accent-light)', color: 'var(--accent)', fontSize: '0.75rem', fontWeight: 600, padding: '4px 10px', borderRadius: 100, whiteSpace: 'nowrap', marginLeft: 16 }}>{t.years}</span>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── Projects ── */
    const projects = [
      {
        name: 'PMDB',
        url: 'https://www.pmdb-app.com',
        urlLabel: 'pmdb-app.com',
        desc: 'A comprehensive database application for property owners and developers — tracking deals, contacts, and development pipelines.',
        tag: 'SaaS · Real Estate',
      },
      {
        name: 'Photolib',
        url: 'https://photolib.pmdb-app.com',
        urlLabel: 'photolib.pmdb-app.com',
        desc: 'A photographer\'s photo-sharing platform driven by curated albums — clean uploads, instant sharing, no social media noise.',
        tag: 'Media · Photography',
      },
      {
        name: 'Jeepfreak',
        url: 'https://www.jeepfreak.com',
        urlLabel: 'jeepfreak.com',
        desc: 'A regional marketplace for Jeeps and Jeep parts across Idaho — purpose-built classifieds for a passionate enthusiast community.',
        tag: 'Marketplace · Automotive',
      },
      {
        name: 'BEST Places to Work',
        url: 'https://www.bestplacestoworkinidaho.com',
        urlLabel: 'bestplacestoworkinidaho.com',
        desc: 'An employer-ranking service covering Idaho, Oregon, and Washington — powered by real employee data, not opinions.',
        tag: 'HR · Data · Rankings',
      },
    ];

    function Projects() {
      return (
        <section id="projects" style={{ background: 'var(--bg)', padding: '100px 32px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto' }}>
            <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.8rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 16 }}>Portfolio</p>
            <h2 className="reveal reveal-delay-1" style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 600, color: 'var(--ink)', marginBottom: 60, lineHeight: 1.2 }}>
              Selected work
            </h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: 24 }}>
              {projects.map((p, i) => (
                <div key={i} className={`reveal reveal-delay-${i % 4}`} style={{
                  background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 12,
                  padding: '32px', display: 'flex', flexDirection: 'column', gap: 14,
                  transition: 'box-shadow 0.25s, transform 0.25s',
                }}
                  onMouseEnter={e => { e.currentTarget.style.boxShadow = '0 8px 32px rgba(0,0,0,0.1)'; e.currentTarget.style.transform = 'translateY(-3px)'; }}
                  onMouseLeave={e => { e.currentTarget.style.boxShadow = 'none'; e.currentTarget.style.transform = 'none'; }}
                >
                  <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12 }}>
                    <h3 style={{ fontFamily: 'var(--serif)', fontSize: '1.3rem', fontWeight: 600 }}>{p.name}</h3>

    /* ── About ── */
    function About() {
      return (
        <section id="about" style={{ background: 'var(--bg-alt)', padding: '100px 32px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, alignItems: 'center' }}>
            <div>
              <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.8rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 16 }}>About</p>
              <h2 className="reveal reveal-delay-1" style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(2rem, 3.5vw, 2.8rem)', fontWeight: 600, lineHeight: 1.2, marginBottom: 28 }}>
                A consultant you can<br /><em>actually talk to.</em>
              </h2>
              <div className="reveal reveal-delay-2" style={{ color: 'var(--ink-mid)', lineHeight: 1.8, display: 'flex', flexDirection: 'column', gap: 16 }}>
                <p>Hi, I'm Justin — the founder and sole consultant at JBK Consulting LLC. I've spent over a decade building web software for businesses of all sizes, from local startups to enterprise teams.</p>
                <p>I specialize in backend-heavy applications where reliability and maintainability matter most. I work closely with my clients — no handoffs, no offshore teams — just clear communication and solid code.</p>
                <p>Based in Idaho. Available for remote engagements nationwide.</p>
              </div>
            </div>
            <div className="reveal reveal-delay-2" style={{
              background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 16,
              padding: '48px 40px', display: 'flex', flexDirection: 'column', gap: 28,

              {[
                { label: 'Years of experience', value: '10+' },

    /* ── Testimonials ── */
    const testimonials = [
      { quote: "Justin delivered a complex Rails application on time and on budget. His communication throughout the project was excellent — we always knew where things stood.", name: "Sarah M.", role: "Founder, Local SaaS Co." },
      { quote: "We hired JBK to modernize a legacy .NET app. He approached it methodically, explained every decision clearly, and the result was a night-and-day improvement.", name: "Mark T.", role: "CTO, Regional Services Firm" },
      { quote: "Working with Justin felt like having a senior engineer on the team. He flagged issues before they became problems and always had a solution ready.", name: "Lena R.", role: "Product Manager, Idaho Startup" },
    ];

    function Testimonials({ show }) {
      if (!show) return null;
      return (
        <section id="testimonials" style={{ background: 'var(--bg)', padding: '100px 32px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto' }}>
            <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.8rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 16 }}>Kind words</p>
            <h2 className="reveal reveal-delay-1" style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 600, marginBottom: 60, lineHeight: 1.2 }}>
              What clients say
            </h2>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 24 }}>
              {testimonials.map((t, i) => (
                <div key={i} className={`reveal reveal-delay-${i}`} style={{
                  background: 'var(--bg-alt)', borderRadius: 12, padding: '36px 32px',
                  border: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 24,
                }}>
                  <p style={{ fontFamily: 'var(--serif)', fontSize: '1rem', fontStyle: 'italic', lineHeight: 1.75, color: 'var(--ink-mid)', flex: 1 }}>"{t.quote}"</p>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: '0.9rem' }}>{t.name}</div>
                    <div style={{ color: 'var(--ink-soft)', fontSize: '0.82rem' }}>{t.role}</div>
                  </div>
                </div>
              ))}
            </div>
            <p className="reveal" style={{ marginTop: 24, color: 'var(--ink-soft)', fontSize: '0.8rem', fontStyle: 'italic' }}>* Placeholder testimonials — swap with real client quotes.</p>
          </div>
        </section>
      );
    }


    /* ── FAQ ── */
    const faqs = [
      {
        q: 'What kind of projects are the best fit?',
        a: 'Custom web applications, internal tools, legacy app stabilization, API integrations, data-heavy workflows, and backend-heavy systems where reliability and maintainability matter.'
      },
      {
        q: 'Can you work with an existing codebase?',
        a: 'Yes. I can review the current architecture, find the riskiest areas, improve deployment and observability, clean up technical debt, and create a practical modernization plan.'
      },
      {
        q: 'Do I need a full specification before reaching out?',
        a: 'No. A short description of the business problem, what tools you use today, and what outcome you want is enough to start a useful conversation.'
      },
      {
        q: 'Do you work only in Idaho?',
        a: 'No. I am based in Idaho and available for remote engagements nationwide.'
      }

    function FAQ() {
      return (
        <section id="faq" style={{ background: 'var(--bg)', padding: '100px 32px' }}>
          <div style={{ maxWidth: 900, margin: '0 auto' }}>
            <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.8rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 16 }}>Common questions</p>
            <h2 className="reveal reveal-delay-1" style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 600, color: 'var(--ink)', marginBottom: 44, lineHeight: 1.2 }}>
              Before we talk
            </h2>
            <div style={{ display: 'grid', gap: 16 }}>
              {faqs.map((item, i) => (
                <div key={i} className={`reveal reveal-delay-${i % 4}`} style={{ background: 'var(--bg-alt)', border: '1px solid var(--border)', borderRadius: 12, padding: '28px 30px' }}>
                  <h3 style={{ fontFamily: 'var(--serif)', fontSize: '1.15rem', fontWeight: 600, marginBottom: 10 }}>{item.q}</h3>
                  <p style={{ color: 'var(--ink-mid)', fontSize: '0.95rem', lineHeight: 1.75 }}>{item.a}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ── Contact ── */
    function Contact() {
      const [form, setForm] = useState({ name: '', email: '', message: '' });
      const [status, setStatus] = useState('idle'); // idle | sending | done

      const handleSubmit = (e) => {
        e.preventDefault();
        setStatus('sending');
        const subject = encodeURIComponent(`Project inquiry from ${form.name || 'JBK Consulting website'}`);
        const body = encodeURIComponent(`Name: ${form.name}\nEmail: ${form.email}\n\n${form.message}`);
        window.location.href = `mailto:justin@jbkconsultingllc.com?subject=${subject}&body=${body}`;
        setTimeout(() => setStatus('done'), 600);
      };

      return (
        <section id="contact" style={{ background: 'var(--bg-dark)', padding: '100px 32px' }}>
          <div style={{ maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, alignItems: 'start' }}>
            <div>
              <p className="reveal" style={{ fontFamily: 'var(--sans)', fontSize: '0.8rem', fontWeight: 500, letterSpacing: '0.12em', color: 'var(--accent)', textTransform: 'uppercase', marginBottom: 16 }}>Let's work together</p>
              <h2 className="reveal reveal-delay-1" style={{ fontFamily: 'var(--serif)', fontSize: 'clamp(2rem, 4vw, 3rem)', fontWeight: 600, color: '#fafaf7', marginBottom: 24, lineHeight: 1.2 }}>
                Got a project<br />in mind?
              </h2>
              <p className="reveal reveal-delay-2" style={{ color: 'rgba(250,250,247,0.55)', lineHeight: 1.8, marginBottom: 40 }}>
                Tell me what is slowing your business down, what software you already have, and what a successful outcome would look like. I typically respond within one business day.
              </p>
              <a href="mailto:justin@jbkconsultingllc.com" className="reveal reveal-delay-3" style={{
                display: 'inline-flex', alignItems: 'center', gap: 8,
                color: 'var(--accent)', fontSize: '1rem', fontWeight: 500, textDecoration: 'none',
              }}
                onMouseEnter={e => e.currentTarget.style.textDecoration = 'underline'}
                onMouseLeave={e => e.currentTarget.style.textDecoration = 'none'}
              >
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="3" width="14" height="10" rx="2" stroke="currentColor" strokeWidth="1.5" /><path d="M1 5l7 5 7-5" stroke="currentColor" strokeWidth="1.5" /></svg>
                justin@jbkconsultingllc.com
              </a>
            </div>

            <div className="reveal reveal-delay-2">
              {status === 'done' ? (
                <div style={{ background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 12, padding: '48px 40px', textAlign: 'center' }}>
                  <div style={{ width: 48, height: 48, background: 'var(--accent)', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 20px' }}>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10l4.5 4.5L16 6" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
                  </div>
                  <h3 style={{ fontFamily: 'var(--serif)', fontSize: '1.3rem', color: '#fafaf7', marginBottom: 12 }}>Message received!</h3>
                  <p style={{ color: 'rgba(250,250,247,0.55)', fontSize: '0.9rem' }}>Your email client should be open with the message ready to send.</p>
                </div>
              ) : (
                <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                  {[
                    { label: 'Your name', key: 'name', type: 'text', placeholder: 'Jane Smith' },
                    { label: 'Email', key: 'email', type: 'email', placeholder: 'jane@company.com' },
                  ].map(f => (
                    <div key={f.key} style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <label style={{ color: 'rgba(250,250,247,0.7)', fontSize: '0.82rem', fontWeight: 500 }}>{f.label}</label>
                      <input
                        type={f.type} required placeholder={f.placeholder}
                        value={form[f.key]}
                        onChange={e => setForm(p => ({ ...p, [f.key]: e.target.value }))}
                        style={{
                          background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)',
                          borderRadius: 8, padding: '12px 16px', color: '#fafaf7', fontSize: '0.95rem',
                          outline: 'none', fontFamily: 'var(--sans)', transition: 'border-color 0.2s',
                        }}
                        onFocus={e => e.target.style.borderColor = 'var(--accent)'}
                        onBlur={e => e.target.style.borderColor = 'rgba(255,255,255,0.12)'}
                      />
                    </div>
                  ))}
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    <label style={{ color: 'rgba(250,250,247,0.7)', fontSize: '0.82rem', fontWeight: 500 }}>Message</label>
                    <textarea
                      required rows={5} placeholder="Tell me about your project..."
                      value={form.message}
                      onChange={e => setForm(p => ({ ...p, message: e.target.value }))}
                      style={{
                        background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)',
                        borderRadius: 8, padding: '12px 16px', color: '#fafaf7', fontSize: '0.95rem',
                        outline: 'none', fontFamily: 'var(--sans)', resize: 'vertical', transition: 'border-color 0.2s',
                      }}
                      onFocus={e => e.target.style.borderColor = 'var(--accent)'}
                      onBlur={e => e.target.style.borderColor = 'rgba(255,255,255,0.12)'}
                    />
                  </div>
                  <button type="submit" disabled={status === 'sending'} style={{
                    background: 'var(--accent)', color: '#fff', border: 'none', borderRadius: 100,
                    padding: '14px', fontWeight: 600, fontSize: '0.95rem', cursor: 'pointer',
                    fontFamily: 'var(--sans)', transition: 'opacity 0.2s', opacity: status === 'sending' ? 0.7 : 1,
                  }}>
                    {status === 'sending' ? 'Opening email…' : 'Start the conversation'}
                  </button>
                </form>
              )}
            </div>
          </div>
        </section>
      );
    }

    /* ── Footer ── */
    function Footer() {
      return (
        <footer style={{ background: 'var(--bg-dark)', borderTop: '1px solid rgba(255,255,255,0.07)', padding: '32px', textAlign: 'center' }}>
          <p style={{ color: 'rgba(250,250,247,0.35)', fontSize: '0.82rem' }}>© 2026 JBK Consulting LLC. All rights reserved.</p>
        </footer>
      );
    }

    /* ── Tweaks Panel ── */
    function TweaksPanel({ tweaks, setTweaks, visible }) {
      if (!visible) return null;
      return (
        <div style={{
          position: 'fixed', bottom: 24, right: 24, zIndex: 999,
          background: '#fff', borderRadius: 12, padding: '20px 24px',
          boxShadow: '0 8px 40px rgba(0,0,0,0.18)', width: 280,
          fontFamily: 'var(--sans)', fontSize: '0.85rem',
        }}>
          <div style={{ fontWeight: 600, marginBottom: 16, fontSize: '0.9rem' }}>Tweaks</div>

          <div style={{ marginBottom: 14 }}>
            <label style={{ display: 'block', color: 'var(--ink-soft)', marginBottom: 6, fontSize: '0.78rem' }}>Accent color</label>
            {[
              { label: 'Sage green', val: '#2f7d56' },
              { label: 'Terracotta', val: '#a75f3f' },
              { label: 'Slate blue', val: '#496f9d' },
              { label: 'Warm plum', val: '#8b5b88' },
            ].map(c => (
              <button key={c.val} onClick={() => {
                document.documentElement.style.setProperty('--accent', c.val);
                setTweaks(t => ({ ...t, accentColor: c.val }));
                window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accentColor: c.val } }, '*');
              }} style={{
                display: 'inline-flex', alignItems: 'center', gap: 8, marginRight: 6, marginBottom: 6,
                padding: '5px 10px', border: '1.5px solid', borderRadius: 100, cursor: 'pointer',
                background: tweaks.accentColor === c.val ? 'var(--accent-light)' : 'transparent',
                borderColor: tweaks.accentColor === c.val ? 'var(--accent)' : 'var(--border)',
                fontFamily: 'var(--sans)', fontSize: '0.75rem',
              }}>{c.label}</button>
            ))}
          </div>

          <div style={{ marginBottom: 14 }}>
            <label style={{ display: 'block', color: 'var(--ink-soft)', marginBottom: 6, fontSize: '0.78rem' }}>Show testimonials</label>
            <button onClick={() => {
              const next = !tweaks.showTestimonials;
              setTweaks(t => ({ ...t, showTestimonials: next }));
              window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { showTestimonials: next } }, '*');
            }} style={{
              padding: '6px 16px', borderRadius: 100, cursor: 'pointer',
              background: tweaks.showTestimonials ? 'var(--accent)' : 'transparent',
              color: tweaks.showTestimonials ? '#fff' : 'var(--ink)',
              border: '1.5px solid', borderColor: tweaks.showTestimonials ? 'var(--accent)' : 'var(--border)',
              fontFamily: 'var(--sans)', fontSize: '0.8rem',
            }}>
              {tweaks.showTestimonials ? 'Shown' : 'Hidden'}
            </button>
          </div>
        </div>
      );
    }

    /* ── App ── */
    function App() {
      const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
      const [tweaksVisible, setTweaksVisible] = useState(false);
      const [activeSection, setActiveSection] = useState('');

      useReveal();

      useEffect(() => {
        document.documentElement.style.setProperty('--accent', tweaks.accentColor);
      }, [tweaks.accentColor]);

      useEffect(() => {
        window.addEventListener('message', e => {
          if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
          if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
        });
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
      }, []);

      useEffect(() => {
        const sections = ['services', 'expertise', 'projects', 'about', 'faq', 'testimonials', 'contact'];
        const obs = new IntersectionObserver(entries => {
          entries.forEach(e => { if (e.isIntersecting) setActiveSection(e.target.id); });
        }, { threshold: 0.3 });
        sections.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
        return () => obs.disconnect();
      }, []);

      return (
        <>
          <Nav activeSection={activeSection} />
          <Hero tweaks={tweaks} />
          <BestFit />
          <Services />
          <Engagements />
          <Expertise />
          <Projects />
          <About />
          <FAQ />
          <Testimonials show={tweaks.showTestimonials} />
          <Contact />
          <Footer />
          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</html>
